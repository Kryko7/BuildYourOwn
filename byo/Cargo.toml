[package]
name = "byo"
version = "0.1.0"
edition = "2021"
description = "Build Your Own — one command for the shell and Kafka tracks: run the testers, keep progress in SQLite, serve the journey site"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
open = "5"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

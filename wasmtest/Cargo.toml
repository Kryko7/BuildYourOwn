[package]
name = "wasmtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "stage-by-stage black-box conformance tester for WebAssembly runtimes"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
owo-colors = "4"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11.0"
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true

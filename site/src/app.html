<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#191327" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fcf6f0" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
		/>
		<script>
			// Paint the right theme before first paint: no flash, no layout shift.
			try {
				const stored = JSON.parse(localStorage.getItem('byo:theme:v1') || '"system"');
				const dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

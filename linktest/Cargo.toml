[package]
name = "linktest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "stage-by-stage black-box conformance tester for static ELF64 x86-64 linkers"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
owo-colors = "4"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"

[dev-dependencies]
# Only ever a *cross-check*: the fixture bytes are written by src/elf/write.rs, and
# tests/elf_roundtrip.rs proves an independent parser agrees with them.
object = { version = "0.37", default-features = false, features = [
    "read",
    "elf",
    "std",
] }

[profile.release]
strip = true

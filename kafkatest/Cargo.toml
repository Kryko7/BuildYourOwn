[package]
name = "kafkatest"
version = "0.1.0"
edition = "2021"
description = "stage-by-stage black-box conformance tester for Kafka brokers"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
crc32c = "0.6"
indexmap = "2"
kafka-protocol = { version = "0.18", features = [
    "gzip",
    "snappy",
    "lz4",
    "zstd",
    "messages_enums",
] }
libc = "0.2"
owo-colors = "4"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11.0"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "process",
    "sync",
    "fs",
] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true

  - name: "10000 lines of output are captured completely"
    tags: [ext]
    fixtures:
      path_isolated: true
      executables:
        big: |
          i=0
          while [ $i -lt 10000 ]; do echo "line $i"; i=$((i+1)); done
    input: ["big", "exit 0"]
    expect:
      stdout: { regex: "(?s)^line 0\n.*\nline 9999$" }


  - name: "binary and non-ASCII output passes through unchanged"
    tags: [ext]
    fixtures:
      path_isolated: true
      executables:
        bytes: "printf 'caf\\303\\251 \\001\\002\\n'"
    input: ["bytes", "exit 0"]
    expect:
      stdout: "café \u0001\u0002"


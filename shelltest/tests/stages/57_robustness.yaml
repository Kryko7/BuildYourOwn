stage: 57
name: "Robustness: long lines, continuation prompt, zombies, binary output"
tests:
  - name: "a 5000-character argument survives intact"
    tags: [ext]
    input: ["echo ", "exit 0"]
    expect:
      stdout: ""
      exit_code: 0

  - name: "an unterminated single quote shows the continuation prompt"
    tags: [ext]
    mode: pty
    steps:
      - wait: "$ "
      - send: "echo 'a\r"
      - wait: "> "
      - send: "b'\r"
      - wait: "$ "
      - send: "exit\r"
    expect:
      terminal: { regex: "(?s)^\\$ echo 'a\n> b'\na\nb\n\\$ " }

  - name: "an unterminated double quote shows the continuation prompt"
    tags: [ext]
    mode: pty
    steps:
      - wait: "$ "
      - send: "echo \"x\r"
      - wait: "> "
      - send: "y\"\r"
      - wait: "$ "
      - send: "exit\r"
    expect:
      terminal: { regex: "(?s)> y\"\nx\ny\n" }

  - name: "no zombie processes remain after 100 children"
    tags: [ext]
    fixtures:
      path_isolated: true
      executables:
        noop: "exit 0"
        zombies: |
          n=0
          for s in /proc/[0-9]*/stat; do
            [ -r "$s" ] || continue
            set -- $(cat "$s" 2>/dev/null) || continue
            if [ "$4" = "$PPID" ] && [ "$3" = "Z" ]; then n=$((n+1)); fi
          done
          echo "$n"

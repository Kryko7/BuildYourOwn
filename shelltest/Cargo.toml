[package]
name = "shelltest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "stage-by-stage black-box tester for POSIX shells"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.31", features = ["term", "process", "poll", "signal", "ioctl", "fs"] }
owo-colors = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
tempfile = "3"

[profile.release]
strip = true
